name: Deploy server

on:
  workflow_run:
    workflows: [Publish distribution]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the changes without applying them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_SERVER == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: [self-hosted, linux, cbo]
    timeout-minutes: 30
    environment: cbo-server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy mods and configs
        env:
          ROOT: ${{ github.workspace }}
          SERVER_ID: ${{ vars.SERVER_ID }}
          CBO_CONTAINER: ${{ vars.CBO_CONTAINER }}
          CBO_DATA_DIR: ${{ vars.CBO_DATA_DIR }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/deploy-server.mjs
