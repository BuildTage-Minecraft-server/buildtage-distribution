name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DISTRIBUTION_DEPLOY_KEY: ${{ secrets.DISTRIBUTION_DEPLOY_KEY }}
      DISTRIBUTION_REPO: ${{ vars.DISTRIBUTION_REPO || 'BuildTage-Minecraft-server/buildtage-distribution' }}
      DISTRIBUTION_MODS_PATH: ${{ vars.DISTRIBUTION_MODS_PATH || 'servers/CBO-1.20.1/forgemods/required' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches mod_version
        run: |
          version="$(grep -E '^mod_version=' gradle.properties | tr -d '\r' | cut -d= -f2)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${version}"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Generate release notes
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: build/libs/*.jar
          fail_on_unmatched_files: true

      - name: Check out distribution repository
        if: env.DISTRIBUTION_DEPLOY_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DISTRIBUTION_REPO }}
          ssh-key: ${{ env.DISTRIBUTION_DEPLOY_KEY }}
          ref: main
          path: distribution

      - name: Publish mod to distribution repository
        if: env.DISTRIBUTION_DEPLOY_KEY != ''
        run: |
          set -euo pipefail
          jars=(build/libs/lobbyshooter-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one jar in build/libs, found ${#jars[@]}"
            exit 1
          fi
          dest="distribution/${DISTRIBUTION_MODS_PATH}"
          mkdir -p "$dest"
          rm -f "$dest"/lobbyshooter-*.jar
          cp "${jars[0]}" "$dest/"
          cd distribution
          git add -A -- "$DISTRIBUTION_MODS_PATH"
          if git diff --cached --quiet; then
            echo "Distribution repository is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update lobbyshooter to ${GITHUB_REF_NAME#v}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Warn when distribution is not configured
        if: env.DISTRIBUTION_DEPLOY_KEY == ''
        run: echo "::warning::DISTRIBUTION_DEPLOY_KEY is not set, the mod was not sent to the distribution repository"
